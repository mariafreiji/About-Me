<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
</head>
<body>
    <header>
    <h1>Welcome to My About Me Page</h1>

    <nav>
        <a href="#about">About Me</a>
        <a href="#contact">Contact Me</a>
    </nav>
</header>

<main>
    <section id="about">
        <h2>About Me</h2>
        <img
                src="maria-photo.jpg"
                alt="Portrait of Maria Freiji"
                width="300"
        >

        <p>
            Hello! I'm Maria Freiji, a computer and communications
            engineering student at ESIB.
        </p>

        <p>
            I am interested in software engineering and technology.
            I enjoy learning new skills and working on creative projects.
        </p>
    </section>
    <section id="contact">
        <h2>Contact Me</h2>

        <form>
            <div>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                ></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </section>
</main>

<footer>
    <p>Created by Maria</p>
</footer>
</body>
</html>
